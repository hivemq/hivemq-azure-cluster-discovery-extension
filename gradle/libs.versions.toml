[versions]
assertj = "3.27.7"
awaitility = "4.3.0"
azure-core-http-jdk-httpclient = "1.1.7"
azure-storage-blob = "12.35.1"
gradleOci-junitJupiter = "0.8.0"
hivemq-extensionSdk = "4.7.5"
jackson = "2.22.2"
jetbrains-annotations = "26.1.0"
junit-jupiter = "5.10.0"
logback = "1.6.3"
mockito = "5.24.0"
owner = "1.0.12"
projectReactor-core = "3.8.7"
testcontainers = "2.0.5"

[libraries]
assertj = { module = "org.assertj:assertj-core", version.ref = "assertj" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }
azure-core-http-jdkHttpClient = { module = "com.azure:azure-core-http-jdk-httpclient", version.ref = "azure-core-http-jdk-httpclient" }
azure-storage-blob = { module = "com.azure:azure-storage-blob", version.ref = "azure-storage-blob" }
gradleOci-junitJupiter = { module = "io.github.sgtsilvio:gradle-oci-junit-jupiter", version.ref = "gradleOci-junitJupiter" }
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrains-annotations" }
logback-classic = { module = "ch.qos.logback:logback-classic", version.ref = "logback" }
mockito = { module = "org.mockito:mockito-core", version.ref = "mockito" }
owner-java8 = { module = "org.aeonbits.owner:owner-java8", version.ref = "owner" }
projectReactor-core = { module = "io.projectreactor:reactor-core", version.ref = "projectReactor-core" }
testcontainers = { module = "org.testcontainers:testcontainers", version.ref = "testcontainers" }
testcontainers-hivemq = { module = "org.testcontainers:testcontainers-hivemq", version.ref = "testcontainers" }
testcontainers-toxiproxy = { module = "org.testcontainers:testcontainers-toxiproxy", version.ref = "testcontainers" }

[plugins]
defaults = { id = "io.github.sgtsilvio.gradle.defaults", version = "0.3.0" }
hivemq-extension = { id = "com.hivemq.extension", version = "5.0.0" }
spotless = { id = "com.diffplug.spotless", version = "8.10.2" }
oci = { id = "io.github.sgtsilvio.gradle.oci", version = "0.30.0" }
